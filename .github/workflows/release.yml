name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release version parity
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="v$(python scripts/release_integrity.py versions)"
          fi
          python scripts/release_integrity.py versions --tag "$release_tag"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Verify release integrity code
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify workbench
        run: npm ci && npm test && npm run build
        working-directory: workbench
      - name: Verify Rust engine
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
      - name: Install Manim system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config
      - name: Verify complete Python runtime
        run: |
          python -m pip install --constraint runtime/constraints-full.txt -e 'runtime[full,test]'
          python -m pytest runtime/tests -q
          python -c 'import manim; print(manim.__version__)'

  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: target/x86_64-unknown-linux-musl/release/manim-director
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/manim-director
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/manim-director
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/manim-director.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install static Linux linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build embedded workbench
        run: npm ci && npm run build
        working-directory: workbench
      - name: Build engine
        run: cargo build --release --locked --target ${{ matrix.target }} -p manim-director-cli --bin manim-director
      - name: Package engine
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: python scripts/package_release.py --binary '${{ matrix.binary }}' --target '${{ matrix.target }}' --version "${RELEASE_TAG#v}" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 manifest
        run: python scripts/release_integrity.py checksums --directory dist --output dist/SHA256SUMS
      - name: Add license notices
        run: cp LICENSE THIRD_PARTY_NOTICES.md dist/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ needs.verify.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
