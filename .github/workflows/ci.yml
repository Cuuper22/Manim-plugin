name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check release integrity contracts
        run: |
          python scripts/release_integrity.py versions
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Test and build workbench
        run: npm ci && npm test && npm run build
        working-directory: workbench
      - name: Check Rust engine
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
      - name: Install Manim system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config
      - name: Check Python runtime
        run: |
          python -m pip install --constraint runtime/constraints-full.txt -e 'runtime[full,test]'
          python -m pytest runtime/tests -q
          python -c 'import manim; print(manim.__version__)'
