name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runtime/constraints-full.txt

      # Manim, LaTeX and FFmpeg come first: engine render tests and the
      # Manim-backed runtime tests need them.
      - name: Install Manim system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended dvisvgm
      - name: Install Python runtime with Manim
        run: python -m pip install --constraint runtime/constraints-full.txt -e 'runtime[full,test]'
      - name: Install workbench dependencies
        run: npm ci --prefix workbench

      - name: Check scripts and release metadata
        run: make check-scripts PYTHON=python
      - name: Check workbench
        run: make check-workbench
      - name: Check Rust engine
        run: make check-engine
      - name: Check Python runtime
        shell: bash
        run: |
          make check-runtime PYTHON=python | tee pytest.log
          # Every tool the runtime tests need is installed here, so none may skip.
          ! grep -q '^SKIPPED' pytest.log
      - name: Workbench end-to-end against the real engine
        shell: bash
        run: |
          npx --prefix workbench playwright-core install --with-deps chromium
          MANIM_DIRECTOR_PYTHON="$(command -v python)" make check-e2e
