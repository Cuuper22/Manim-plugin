version: 1
project:
  name: {{name}}
  description: Pattern 3, picture to formula. Each odd number is an L of dots that wraps a square.
  seed: {{seed}}
engine:
  source: scenes/main.py
  main_scene: OddSquares
theme: {{theme}}
brief:
  viewer:
    who: a curious 16-year-old who knows algebra, watching on a phone
    level: general
    knows: [odd numbers, square numbers, "$n^2$"]
    new: [the L of dots, "$1 + 3 + \\cdots + (2n-1) = n^2$"]
    question: Why do 1, 1+3, 1+3+5 keep landing on squares?
    wrong_guess: a coincidence that breaks down for bigger numbers
    aha: each odd number is an L that wraps a k×k square into a (k+1)×(k+1) square
    payoff: can say 1 + 3 + … + 19 = 100 at a glance, and why
    colors: {primary: odd numbers 1 and 5, secondary: odd numbers 3 and 7}
storyboard:
  - id: hook
    intent: introduce
    audience_question: Why do these sums of odd numbers land on squares?
    changes: the sums 1, 1+3, 1+3+5 appear with their totals
    takeaway: Adding odd numbers in order gives 1, 4, 9, all squares so far.
  - id: predict
    intent: introduce
    audience_question: Does it keep working for bigger numbers?
    changes: 1 + 3 + 5 + 7 = 16 and 1 + 3 + ⋯ + 19 = ? join the column
    takeaway: The viewer commits to a guess before the picture.
    keep: [sums]
  - id: picture
    intent: explain
    audience_question: What does adding 3 look like?
    changes: an L of 3 dots wraps the single dot, arm, arm, corner
    takeaway: 1 dot and an L of 3 fill a 2×2 square.
    keep: [sums]
  - id: again
    intent: explain
    audience_question: Does the next odd number fit the same way?
    changes: an L of 5 wraps the 2×2 square
    takeaway: An L of 5 turns 2×2 into 3×3.
    keep: [sums, dots]
  - id: why
    intent: reveal
    audience_question: Why does the L of 7 fit exactly?
    changes: the L of 7 wraps 3×3 into 4×4, as 3 + 3 + 1
    takeaway: Two arms of 3 and a corner make 7, and the square grows to 4×4 = 16.
    keep: [sums, dots]
    aha: true
  - id: formula
    intent: prove
    audience_question: Does it work for any number of Ls?
    changes: 1 + 3 + 5 + 7 = 4² becomes 1 + 3 + ⋯ + (2n − 1) = n²
    takeaway: The n-th L has 2n − 1 dots (the 4th has 7), and n Ls make an n×n square.
    keep: [sums, dots]
  - id: recap
    intent: recap
    audience_question: So is 1 + 3 + ⋯ + 19 a square?
    changes: the L of 7 wraps the square again, fast; the ? becomes 10² = 100
    takeaway: 19 is the 10th odd number, so 10 Ls make a 10×10 square of 100.
    keep: [sums, dots]
