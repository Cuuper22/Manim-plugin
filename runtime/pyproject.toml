[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-director-runtime"
version = "1.1.0"
description = "Bridge worker and authoring API behind Manim Director"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Manim Director contributors"}]
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
visual = ["Pillow>=10.1", "numpy>=1.24"]
math = ["sympy>=1.12"]
ingest = ["pypdf>=5"]
full = ["manim>=0.21,<0.22", "Pillow>=10.1", "numpy>=1.24", "sympy>=1.12", "pypdf>=5"]
test = ["pytest>=8", "ruff>=0.15"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
manim_director_runtime = [
  "data/*.json",
  "data/templates/**/*.py",
  "data/templates/**/*.yaml",
  "data/templates/**/*.md",
  "data/templates/**/*.cfg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Scene templates are user code, written the way Manim scenes usually are.
"src/manim_director_runtime/data/templates/**/*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["manim_director_runtime"]
