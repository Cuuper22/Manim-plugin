version: 1
project:
  name: Generalized Fibonacci
  description: Every sequence with x[n+2] = p x[n+1] + q x[n], from a family of examples to its roots.
  seed: 73
  source_dir: .
  output_dir: dist
engine:
  source: scenes.py
  main_scene: GeneralizedFibonacci
theme: midnight
direction:
  symbols:
    p: primary
    q: secondary
    \lambda: accent
brief:
  duration_seconds: 38.1
inputs:
  data:
    - data/sequences.csv
scenes:
  - id: narrative
    class: GeneralizedFibonacci
    file: scenes.py
    purpose: The full cut, from a family of sequences to its characteristic roots.
    duration_seconds: 38.1
  - id: sequence-data
    class: SequenceData
    file: scenes.py
    purpose: The recorded data on a linear scale, then on a log scale.
    duration_seconds: 8.6
  - id: characteristic-roots
    class: CharacteristicRoots
    file: scenes.py
    purpose: The characteristic equation from a guess, and the double-root case.
    duration_seconds: 14.9
  - id: companion-matrix
    class: CompanionMatrix
    file: scenes.py
    purpose: The Fibonacci state walk under C, with a camera close-up that pulls back.
    duration_seconds: 20.1
  - id: state-orbit-3d
    class: StateOrbit3D
    file: scenes.py
    purpose: The oscillator's states winding around the time axis in 3D.
    duration_seconds: 11.5
storyboard:
  - id: hook
    intent: introduce
    audience_question: Is Fibonacci a one-off, or one case of something larger?
    takeaway: One two-step rule with coefficients p and q covers a whole family.
    duration: 4.3
  - id: family
    intent: compare
    audience_question: What do other coefficients and seeds produce?
    takeaway: Lucas, Pell and an oscillator come from the same rule.
    duration: 4.3
  - id: data
    intent: explain
    audience_question: How differently do these sequences behave?
    takeaway: Three grow and one cycles, read straight from the recorded data.
    duration: 4.3
  - id: state-space
    intent: explain
    audience_question: Can one step of the rule be a single operation?
    takeaway: Stacking neighbors into a state makes each step one product with C.
    duration: 5.4
  - id: roots
    intent: prove
    audience_question: What decides the long-run behavior?
    takeaway: The eigenvalues of C, the roots of the characteristic equation.
    duration: 7.2
  - id: edge-case
    intent: prove
    audience_question: What if the two roots are equal?
    takeaway: A double root adds a factor linear in n.
    duration: 7.2
  - id: recap
    intent: recap
    audience_question: What fixes a sequence completely?
    takeaway: Coefficients pick the rule, seeds the start, roots the long run.
    duration: 5.4
narration:
  manifest: narration.json
captions:
  source: captions.vtt
profiles:
  loop-gif: {resolution: [640, 360], fps: 15, format: gif}
  transparent: {quality: high, format: mov, alpha: true}
